# Run all three tiers locally: docker compose up --build, then open http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes-local-only
      POSTGRES_DB: notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: notes
      DB_PASSWORD: notes-local-only
      DB_NAME: notes
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
