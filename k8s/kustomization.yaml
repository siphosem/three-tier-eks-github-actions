apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config.yaml
  - backend.yaml
  - frontend.yaml
  - network-policies.yaml
# The CD workflow runs `kustomize edit set image` with the ECR URIs and commit SHA.
images:
  - name: backend
    newName: backend
    newTag: latest
  - name: frontend
    newName: frontend
    newTag: latest
